[package]
name = "netbraid-adapter-tshark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bounded, receipt-bearing saved-capture normalization through TShark"
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
exclude = [
    "tests/curated_corpus.rs",
    "tests/fixtures/third-party-licenses/**",
    "tests/fixtures/upstream/**",
]
keywords = ["network-analysis", "pcap", "tshark", "wireshark"]
categories = ["network-programming", "development-tools::debugging"]

[dependencies]
csv = "1.3"
netbraid-evidence = { version = "0.3.0", path = "../netbraid-evidence" }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3"

[dev-dependencies]
netbraid-replay = { version = "0.3.0", path = "../netbraid-replay" }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
