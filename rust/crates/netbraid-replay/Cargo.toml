[dependencies]
netbraid-evidence = { version = "0.2.0", path = "../netbraid-evidence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3"
