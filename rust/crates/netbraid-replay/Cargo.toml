[package]
name = "netbraid-replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Deterministic replay and projections for Netbraid evidence"
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["network-analysis", "replay", "jsonl", "forensics"]
