[package]
name = "netbraid"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
description = "Inspect and replay provenance-preserving network evidence"
license = "(MIT OR Unlicense) AND BSD-3-Clause"
repository = "https://github.com/arclabs561/netbraid"
publish = ["crates-io"]
readme = "../README.md"
exclude = [
    "tests/adapter_curated_corpus.rs",
    "tests/fixtures/adapter/third-party-licenses/**",
    "tests/fixtures/adapter/upstream/**",
    "tests/fixtures/*.hex",
    "tests/pcap_cli.rs",
    "tests/scenario_cli.rs",
]
keywords = ["network-analysis", "pcap", "replay", "tshark"]
categories = ["command-line-utilities", "network-programming"]

[features]
default = ["cli"]
adapter-tshark = ["dep:csv", "dep:tempfile"]
cli = ["adapter-tshark", "dep:anyhow", "dep:clap"]
scenario-fixtures = []
scenario-fixtures-capture-derived = []

[[bin]]
name = "netbraid"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "adapter_curated_corpus"
path = "tests/adapter_curated_corpus.rs"
required-features = ["adapter-tshark"]

[[test]]
name = "adapter_tshark_smoke"
path = "tests/adapter_tshark_smoke.rs"
required-features = ["adapter-tshark"]

[[test]]
name = "cli_identity"
path = "tests/cli_identity.rs"
required-features = ["cli"]

[[test]]
name = "pcap_cli"
path = "tests/pcap_cli.rs"
required-features = ["cli"]

[[test]]
name = "scenario_cli"
path = "tests/scenario_cli.rs"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
csv = { version = "1.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
sha1 = "0.10"
tempfile = "3"
