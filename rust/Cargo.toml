[package]
name = "netmon"
version = "0.1.0"
edition = "2021"
description = "Interactive network + RF debug/audit (and, later, presence-fusion) over the Kismet + UniFi substrate"

[[bin]]
name = "netmon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
