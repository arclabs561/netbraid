[package]
name = "netmon"
version = "0.1.0"
edition = "2021"
description = "Inspect the latest saved netops audit snapshot"
publish = false

[workspace]
members = [
    "crates/netmon-evidence",
    "crates/netmon-replay",
]
resolver = "2"

[[bin]]
name = "netmon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
netmon-replay = { path = "crates/netmon-replay" }
