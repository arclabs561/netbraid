[package]
name = "netbraid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Inspect and replay provenance-preserving network evidence"
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../README.md"
keywords = ["network-analysis", "pcap", "replay", "tshark"]
categories = ["command-line-utilities", "network-programming"]

[features]
default = []
scenario-fixtures = ["netbraid-replay/scenario-fixtures"]

[workspace]
members = [
    "crates/netbraid-adapter-tshark",
    "crates/netbraid-evidence",
    "crates/netbraid-replay",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Unlicense"
repository = "https://github.com/arclabs561/netbraid"
publish = ["crates-io"]

[[bin]]
name = "netbraid"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
netbraid-adapter-tshark = { version = "0.3.0", path = "crates/netbraid-adapter-tshark" }
netbraid-evidence = { version = "0.3.0", path = "crates/netbraid-evidence" }
netbraid-replay = { version = "0.3.0", path = "crates/netbraid-replay" }

[dev-dependencies]
tempfile = "3"
