[package]
name = "netbraid"
version = "0.3.3"
edition = "2021"
rust-version = "1.88"
description = "Netbraid tests how network observations relate while keeping their sources separate"
license = "(MIT OR Unlicense) AND BSD-3-Clause"
repository = "https://github.com/arclabs561/netbraid"
publish = ["crates-io"]
readme = "../README.md"
exclude = [
    "tests/adapter_curated_corpus.rs",
    "tests/fixtures/adapter/third-party-licenses/**",
    "tests/fixtures/adapter/upstream/**",
    "tests/fixtures/*.hex",
    "tests/pcap_cli.rs",
    "tests/scenario_cli.rs",
]
keywords = ["network-analysis", "pcap", "replay", "tshark"]
categories = ["command-line-utilities", "network-programming"]

[features]
default = ["cli"]
adapter-tshark = ["dep:csv", "dep:tempfile"]
adapter-kismetdb = ["dep:rusqlite", "dep:tempfile"]
adapter-kismetdb-bundled = ["adapter-kismetdb", "rusqlite/bundled"]
adapter-npy = []
adapter-sdr4iot-csv = ["dep:csv"]
adapter-sigmf = []
adapter-zeek = ["dep:csv"]
cli = ["adapter-tshark", "dep:anyhow", "dep:clap"]
scenario-fixtures = []
scenario-fixtures-capture-derived = []

[[bin]]
name = "netbraid"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "packet_same_event_jsonl"
path = "examples/packet_same_event_jsonl.rs"
test = true

[[example]]
name = "zeek_conn_profile"
path = "examples/zeek_conn_profile.rs"
required-features = ["adapter-zeek"]
test = true

[[test]]
name = "adapter_curated_corpus"
path = "tests/adapter_curated_corpus.rs"
required-features = ["adapter-tshark"]

[[test]]
name = "adapter_tshark_smoke"
path = "tests/adapter_tshark_smoke.rs"
required-features = ["adapter-tshark"]

[[test]]
name = "adapter_kismetdb"
path = "tests/adapter_kismetdb.rs"
required-features = ["adapter-kismetdb"]

[[test]]
name = "adapter_npy"
path = "tests/adapter_npy.rs"
required-features = ["adapter-npy"]

[[test]]
name = "adapter_sdr4iot_csv"
path = "tests/adapter_sdr4iot_csv.rs"
required-features = ["adapter-sdr4iot-csv"]

[[test]]
name = "adapter_sigmf"
path = "tests/adapter_sigmf.rs"
required-features = ["adapter-sigmf"]

[[test]]
name = "adapter_zeek"
path = "tests/adapter_zeek.rs"
required-features = ["adapter-zeek"]

[[test]]
name = "cli_identity"
path = "tests/cli_identity.rs"
required-features = ["cli"]

[[test]]
name = "pcap_cli"
path = "tests/pcap_cli.rs"
required-features = ["cli"]

[[test]]
name = "scenario_cli"
path = "tests/scenario_cli.rs"
required-features = ["cli"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
csv = { version = "1.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = { version = "3", optional = true }
rusqlite = { version = "0.39.0", optional = true, default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
sha1 = "0.10"
tempfile = "3"
