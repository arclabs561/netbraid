[package]
name = "netmon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Inspect saved network evidence and compatibility snapshots"
license.workspace = true
repository.workspace = true
publish.workspace = true

[workspace]
members = [
    "crates/netmon-adapter-tshark",
    "crates/netmon-evidence",
    "crates/netmon-replay",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Unlicense"
repository = "https://github.com/arclabs561/netmon"
publish = false

[[bin]]
name = "netmon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
netmon-adapter-tshark = { path = "crates/netmon-adapter-tshark" }
netmon-evidence = { path = "crates/netmon-evidence" }
netmon-replay = { path = "crates/netmon-replay" }

[dev-dependencies]
tempfile = "3"
