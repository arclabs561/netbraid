name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python data and eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: python3 eval/run-python-tests.py

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust -> target
      - name: Install Wireshark CLI tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends tshark
      - run: cargo fmt --all -- --check
      - name: Check parser fuzz harness
        run: cargo check --manifest-path fuzz/Cargo.toml --bin parse_saved_capture_jsonl
      - name: Exercise default feature configurations
        run: |
          cargo test --locked --no-default-features
          cargo check --locked --lib --no-default-features --features scenario-fixtures,scenario-fixtures-capture-derived
          cargo build --locked
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - run: cargo build --locked --all-features
      - run: cargo test --locked --all-features
      - name: Exercise installed Wireshark tools and CLI projections
        run: |
          cargo test --locked --test adapter_tshark_smoke --test adapter_curated_corpus -- --ignored
          cargo test --locked --test pcap_cli -- --ignored
      - name: Verify crates.io package inventory
        run: |
          cargo package --locked --list -p netbraid >"$RUNNER_TEMP/netbraid-package.txt"
          grep -Fqx 'tests/fixtures/replay/scenarios/wifi-hotspot-wifi/scenario.json' "$RUNNER_TEMP/netbraid-package.txt"
          grep -Fqx 'tests/fixtures/replay/scenarios/same-ssid-attachment-boundary/scenario.json' "$RUNNER_TEMP/netbraid-package.txt"
          grep -Fqx 'tests/fixtures/replay/scenarios/same-ssid-attachment-boundary/host-path.jsonl' "$RUNNER_TEMP/netbraid-package.txt"
          grep -Fqx 'tests/fixtures/replay/scenarios/same-ssid-attachment-boundary/viewport.txt' "$RUNNER_TEMP/netbraid-package.txt"
          grep -Fqx 'tests/fixtures/replay/scenarios/vpn-overlay-transition/scenario.json' "$RUNNER_TEMP/netbraid-package.txt"
          grep -Fqx 'tests/fixtures/replay/scenarios/cache-source-gap/scenario.json' "$RUNNER_TEMP/netbraid-package.txt"
          grep -Fqx 'tests/fixtures/replay/scenarios/saved-capture-prefix-boundary/scenario.json' "$RUNNER_TEMP/netbraid-package.txt"
          grep -Fqx 'tests/fixtures/replay/scenarios/saved-capture-prefix-boundary/prefix-6.jsonl' "$RUNNER_TEMP/netbraid-package.txt"
          grep -Fqx 'tests/fixtures/replay/scenarios/saved-capture-prefix-boundary/prefix-7.jsonl' "$RUNNER_TEMP/netbraid-package.txt"
          grep -Fqx 'tests/fixtures/replay/scenarios/saved-capture-prefix-boundary/LICENSE-libpcap-BSD-3-Clause.txt' "$RUNNER_TEMP/netbraid-package.txt"
          if grep -Eq '^tests/(adapter_curated_corpus\.rs$|fixtures/adapter/(third-party-licenses|upstream)/|fixtures/[^/]+\.hex$|pcap_cli\.rs$|scenario_cli\.rs$)' "$RUNNER_TEMP/netbraid-package.txt"; then
            echo "package includes repository-only corpus material" >&2
            exit 1
          fi
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')"
          cargo package --locked -p netbraid
          cargo test --locked --all-features \
            --manifest-path "target/package/netbraid-${package_version}/Cargo.toml"
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  rust-windows:
    name: Rust / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust -> target
      - run: cargo check --locked --lib --no-default-features
      - run: cargo check --locked --all-targets --all-features
