name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust -> target
      - name: Install Wireshark CLI tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends tshark
      - run: cargo fmt --all -- --check
      - name: Exercise default feature configurations
        run: |
          cargo build --locked --workspace
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
      - run: cargo build --locked --workspace --all-features
      - run: cargo test --locked --workspace --all-features
      - name: Exercise installed Wireshark tools and CLI projections
        run: |
          cargo test --locked -p netbraid-adapter-tshark --tests -- --ignored
          cargo test --locked -p netbraid --test pcap_cli -- --ignored
      - name: Verify crates.io package inventories
        run: |
          for package in netbraid-evidence netbraid-replay netbraid-adapter-tshark netbraid; do
            cargo package --locked --list -p "$package" >/dev/null
          done
          cargo package --locked --list -p netbraid-replay >"$RUNNER_TEMP/netbraid-replay-package.txt"
          cargo package --locked --list -p netbraid-adapter-tshark >"$RUNNER_TEMP/netbraid-adapter-tshark-package.txt"
          cargo package --locked --list -p netbraid >"$RUNNER_TEMP/netbraid-package.txt"
          grep -Fqx 'tests/fixtures/scenarios/wifi-hotspot-wifi/scenario.json' "$RUNNER_TEMP/netbraid-replay-package.txt"
          grep -Fqx 'tests/fixtures/scenarios/same-ssid-attachment-boundary/scenario.json' "$RUNNER_TEMP/netbraid-replay-package.txt"
          grep -Fqx 'tests/fixtures/scenarios/same-ssid-attachment-boundary/host-path.jsonl' "$RUNNER_TEMP/netbraid-replay-package.txt"
          grep -Fqx 'tests/fixtures/scenarios/same-ssid-attachment-boundary/viewport.txt' "$RUNNER_TEMP/netbraid-replay-package.txt"
          grep -Fqx 'tests/fixtures/scenarios/vpn-overlay-transition/scenario.json' "$RUNNER_TEMP/netbraid-replay-package.txt"
          grep -Fqx 'tests/fixtures/scenarios/cache-source-gap/scenario.json' "$RUNNER_TEMP/netbraid-replay-package.txt"
          grep -Fqx 'tests/fixtures/scenarios/saved-capture-prefix-boundary/scenario.json' "$RUNNER_TEMP/netbraid-replay-package.txt"
          grep -Fqx 'tests/fixtures/scenarios/saved-capture-prefix-boundary/prefix-6.jsonl' "$RUNNER_TEMP/netbraid-replay-package.txt"
          grep -Fqx 'tests/fixtures/scenarios/saved-capture-prefix-boundary/prefix-7.jsonl' "$RUNNER_TEMP/netbraid-replay-package.txt"
          grep -Fqx 'tests/fixtures/scenarios/saved-capture-prefix-boundary/LICENSE-libpcap-BSD-3-Clause.txt' "$RUNNER_TEMP/netbraid-replay-package.txt"
          if grep -Eq '^tests/(curated_corpus\.rs|fixtures/(third-party-licenses|upstream)/)' "$RUNNER_TEMP/netbraid-adapter-tshark-package.txt"; then
            echo "adapter package includes repository-only corpus material" >&2
            exit 1
          fi
          if grep -Eq '^tests/(fixtures/|pcap_cli\.rs$|scenario_cli\.rs$)' "$RUNNER_TEMP/netbraid-package.txt"; then
            echo "root package includes repository-only corpus material" >&2
            exit 1
          fi
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  rust-windows:
    name: Rust / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust -> target
      - run: cargo check --locked --workspace --all-targets --all-features

  go:
    name: Go compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install legacy capture headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpcap-dev
      - run: go test ./...
      - name: Scan legacy Go compatibility code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
