name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust -> target
      - name: Install Wireshark CLI tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends tshark
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      - name: Exercise installed Wireshark tools and CLI projections
        run: |
          cargo test --locked -p netmon-adapter-tshark --test tshark_smoke -- --ignored
          cargo test --locked -p netmon --test pcap_cli -- --ignored
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  go:
    name: Go compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install legacy capture headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpcap-dev
      - run: go test ./...
      - name: Scan legacy Go compatibility code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
