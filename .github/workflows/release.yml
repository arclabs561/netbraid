name: release

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "netbraid-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.contract.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.88
        run: |
          rustup set profile minimal
          rustup toolchain install 1.88 --no-self-update
      - name: Validate workspace and release ref
        id: contract
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          metadata="$(cargo +1.88 metadata --manifest-path rust/Cargo.toml --no-deps --format-version 1)"
          version="$(jq -er '([.packages[].version] | unique) as $versions | if ($versions | length) == 1 then $versions[0] else error("workspace versions differ") end' <<<"$metadata")"
          jq -e 'all(.packages[];
            .publish == ["crates-io"] and
            .rust_version == "1.88" and
            .license == "MIT OR Unlicense" and
            .repository == "https://github.com/arclabs561/netbraid"
          )' <<<"$metadata" >/dev/null
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            expected_ref="refs/tags/netbraid-v${version}"
            if [[ "$RELEASE_REF" != "$expected_ref" ]]; then
              printf 'release ref %s does not match workspace version %s\n' "$RELEASE_REF" "$version" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              printf 'release commit %s is not reachable from origin/main\n' "$GITHUB_SHA" >&2
              exit 1
            fi
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
      - name: Audit locked dependencies
        run: |
          cargo +1.88 install cargo-audit --locked --version 0.22.2
          cargo audit --file rust/Cargo.lock -D warnings
      - name: Verify crates.io package inventories
        run: |
          for package in netbraid-evidence netbraid-replay netbraid-adapter-tshark netbraid; do
            cargo +1.88 package --locked --list --manifest-path rust/Cargo.toml -p "$package" >/dev/null
          done

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: |
          rustup set profile minimal
          rustup toolchain install 1.88 --no-self-update
      - name: Verify native release target
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          actual_target="$(rustc +1.88 -vV | awk '/^host: / { print $2 }')"
          if [[ "$actual_target" != "$RELEASE_TARGET" ]]; then
            printf 'runner host %s does not match release target %s\n' "$actual_target" "$RELEASE_TARGET" >&2
            exit 1
          fi
      - name: Build locked release binary
        run: cargo +1.88 build --locked --manifest-path rust/Cargo.toml --release --bin netbraid
      - name: Package release
        env:
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="netbraid-v${RELEASE_VERSION}-${RELEASE_TARGET}"
          mkdir -p "dist/${package}/schema-fixtures"
          cp rust/target/release/netbraid "dist/${package}/netbraid"
          cp README.md LICENSE-MIT UNLICENSE "dist/${package}/"
          cp -R rust/crates/netbraid-evidence/tests/fixtures/v0 \
            "dist/${package}/schema-fixtures/"
          tar -czf "dist/${package}.tar.gz" -C dist "$package"
          mkdir -p verify
          tar -xzf "dist/${package}.tar.gz" -C verify
          "verify/${package}/netbraid" --version
          "verify/${package}/netbraid" --help >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netbraid-release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Bundle dry-run assets
    needs:
      - gate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: netbraid-release-*
          path: dist
          merge-multiple: true
      - name: Generate and verify checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 netbraid-v*.tar.gz >SHA256SUMS
          shasum -a 256 --check SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netbraid-release-assets
          path: |
            dist/netbraid-v*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/netbraid-v')
    needs:
      - gate
      - bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: netbraid-release-assets
          path: dist
      - name: Revalidate tag and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "netbraid-v${RELEASE_VERSION}" ]]; then
            printf 'release tag %s does not match workspace version %s\n' "$RELEASE_TAG" "$RELEASE_VERSION" >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          workflow_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          remote_tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$remote_tag_commit" != "$workflow_commit" ]]; then
            printf 'remote tag resolves to %s, workflow built %s\n' \
              "$remote_tag_commit" "$workflow_commit" >&2
            exit 1
          fi
          cd dist
          shasum -a 256 --check SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Netbraid ${RELEASE_VERSION}" \
            --generate-notes
