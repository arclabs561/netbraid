name: release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish the already-owned current main package before tagging
        required: true
        default: check-only
        type: choice
        options:
          - check-only
          - publish-crate
  push:
    tags:
      - "netbraid-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.contract.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.88
        run: |
          rustup set profile minimal
          rustup toolchain install 1.88 --no-self-update
      - name: Validate package and release ref
        id: contract
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          metadata="$(cargo +1.88 metadata --manifest-path rust/Cargo.toml --no-deps --format-version 1)"
          version="$(jq -er '
            if (.packages | length) == 1 and .packages[0].name == "netbraid"
            then .packages[0].version
            else error("expected exactly one netbraid package")
            end
          ' <<<"$metadata")"
          jq -e '
            .packages[0].publish == ["crates-io"] and
            .packages[0].rust_version == "1.88" and
            .packages[0].license == "(MIT OR Unlicense) AND BSD-3-Clause" and
            .packages[0].repository == "https://github.com/arclabs561/netbraid"
          ' <<<"$metadata" >/dev/null
          release_tag="netbraid-v${version}"
          if [[ "$RELEASE_REF" == refs/tags/* || "$RELEASE_CONFIRM" == publish-crate ]]; then
            if tagged_commit="$(git rev-parse --verify --quiet "${release_tag}^{commit}")"; then
              if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
                printf 'version %s is already owned by %s at %s; bump before release\n' \
                  "$version" "$release_tag" "$tagged_commit" >&2
                exit 1
              fi
            fi
          fi
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            expected_ref="refs/tags/${release_tag}"
            if [[ "$RELEASE_REF" != "$expected_ref" ]]; then
              printf 'release ref %s does not match package version %s\n' "$RELEASE_REF" "$version" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              printf 'release commit %s is not reachable from origin/main\n' "$GITHUB_SHA" >&2
              exit 1
            fi
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
      - name: Audit locked dependencies
        run: |
          cargo +1.88 install cargo-audit --locked --version 0.22.2
          cargo audit --file rust/Cargo.lock -D warnings
      - name: Verify crates.io package inventory
        run: |
          cargo +1.88 package --locked --list --manifest-path rust/Cargo.toml -p netbraid >"$RUNNER_TEMP/netbraid-package.txt"
          grep -Fqx 'tests/fixtures/replay/scenarios/saved-capture-prefix-boundary/LICENSE-libpcap-BSD-3-Clause.txt' "$RUNNER_TEMP/netbraid-package.txt"
          if grep -Eq '^tests/(adapter_curated_corpus\.rs$|fixtures/adapter/(third-party-licenses|upstream)/|fixtures/[^/]+\.hex$|pcap_cli\.rs$|scenario_cli\.rs$)' "$RUNNER_TEMP/netbraid-package.txt"; then
            echo "package includes repository-only corpus material" >&2
            exit 1
          fi
          cargo +1.88 package --locked --manifest-path rust/Cargo.toml -p netbraid
          cargo +1.88 test --locked --all-features \
            --manifest-path "rust/target/package/netbraid-${{ steps.contract.outputs.version }}/Cargo.toml"

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: |
          rustup set profile minimal
          rustup toolchain install 1.88 --no-self-update
      - name: Verify native release target
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          actual_target="$(rustc +1.88 -vV | awk '/^host: / { print $2 }')"
          if [[ "$actual_target" != "$RELEASE_TARGET" ]]; then
            printf 'runner host %s does not match release target %s\n' "$actual_target" "$RELEASE_TARGET" >&2
            exit 1
          fi
      - name: Build locked release binary
        run: cargo +1.88 build --locked --manifest-path rust/Cargo.toml --release --bin netbraid
      - name: Package release
        env:
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="netbraid-v${RELEASE_VERSION}-${RELEASE_TARGET}"
          mkdir -p "dist/${package}/schema-fixtures"
          cp rust/target/release/netbraid "dist/${package}/netbraid"
          cp README.md LICENSE-MIT UNLICENSE "dist/${package}/"
          cp -R rust/tests/fixtures/evidence/v0 \
            "dist/${package}/schema-fixtures/"
          tar -czf "dist/${package}.tar.gz" -C dist "$package"
          mkdir -p verify
          tar -xzf "dist/${package}.tar.gz" -C verify
          "verify/${package}/netbraid" --version
          "verify/${package}/netbraid" --help >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netbraid-release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Bundle dry-run assets
    needs:
      - gate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: netbraid-release-*
          path: dist
          merge-multiple: true
      - name: Generate and verify checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 netbraid-v*.tar.gz >SHA256SUMS
          shasum -a 256 --check SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netbraid-release-assets
          path: |
            dist/netbraid-v*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  crates:
    name: Publish crates.io package
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'publish-crate') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/netbraid-v'))
    needs:
      - gate
      - bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: |
          rustup set profile minimal
          rustup toolchain install 1.88 --no-self-update
      - name: Require current main and green CI before manual publication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
            printf 'manual publication commit %s is not current origin/main %s\n' \
              "$(git rev-parse HEAD)" \
              "$(git rev-parse refs/remotes/origin/main)" >&2
            exit 1
          fi
          conclusion="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --event push \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json conclusion \
              --jq '.[0].conclusion // "missing"'
          )"
          if [[ "$conclusion" != success ]]; then
            printf 'CI for %s is %s; refusing crates.io publication\n' \
              "$GITHUB_SHA" "$conclusion" >&2
            exit 1
          fi
      - name: Require existing crate ownership for Trusted Publishing
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          package=netbraid
          if ! http_code="$(
            curl --silent --location --connect-timeout 10 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              --user-agent 'netbraid-release-workflow (https://github.com/arclabs561/netbraid)' \
              "https://crates.io/api/v1/crates/$package"
          )"; then
            printf 'crates.io ownership lookup for %s failed before an HTTP response\n' \
              "$package" >&2
            exit 1
          fi
          case "$http_code" in
            200)
              ;;
            404)
              printf '%s has no crates.io owner; Trusted Publishing cannot bootstrap it\n' \
                "$package" >&2
              printf 'publish the package from a clean current-main checkout with one scoped token, configure release.yml as its trusted publisher, revoke the token, then rerun\n' >&2
              exit 1
              ;;
            *)
              printf 'crates.io ownership lookup for %s returned HTTP %s\n' \
                "$package" "$http_code" >&2
              exit 1
              ;;
          esac
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: github.event_name == 'workflow_dispatch'
        id: auth
      - name: Publish package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          registry_version_matches_release() {
            local package="$1"
            local metadata
            metadata="$(
              curl --fail --silent \
                --user-agent 'netbraid-release-workflow (https://github.com/arclabs561/netbraid)' \
                "https://crates.io/api/v1/crates/$package/$RELEASE_VERSION"
            )" || return 1
            printf '%s' "$metadata" | jq -e \
              --arg package "$package" \
              --arg version "$RELEASE_VERSION" \
              '
                .version.crate == $package and
                .version.num == $version and
                .version.repository == "https://github.com/arclabs561/netbraid" and
                .version.yanked == false
              ' >/dev/null || return 1
            curl --fail --silent --location \
              --user-agent 'netbraid-release-workflow (https://github.com/arclabs561/netbraid)' \
              "https://crates.io/api/v1/crates/$package/$RELEASE_VERSION/download" |
              tar -xzO "$package-$RELEASE_VERSION/.cargo_vcs_info.json" |
              jq -e --arg sha "$GITHUB_SHA" \
                '.git.sha1 == $sha and (.git.dirty // false) == false' >/dev/null
          }
          wait_for_registry_version() {
            local package="$1"
            for _ in {1..24}; do
              if registry_version_matches_release "$package"; then
                return 0
              fi
              sleep 5
            done
            printf 'published %s %s but crates.io did not expose it within 120 seconds\n' \
              "$package" "$RELEASE_VERSION" >&2
            return 1
          }
          package=netbraid
          if registry_version_matches_release "$package"; then
            printf '%s %s from this release commit is already present on crates.io\n' \
              "$package" "$RELEASE_VERSION"
            exit 0
          fi
          if [[ "$RELEASE_EVENT" != workflow_dispatch ]]; then
            printf '%s %s is absent or does not match release commit %s\n' \
              "$package" "$RELEASE_VERSION" "$GITHUB_SHA" >&2
            printf 'publish with the confirmed manual workflow before pushing the tag\n' >&2
            exit 1
          fi
          cargo +1.88 publish --locked --dry-run --manifest-path rust/Cargo.toml -p "$package"
          cargo +1.88 publish --locked --manifest-path rust/Cargo.toml -p "$package"
          wait_for_registry_version "$package"

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/netbraid-v')
    needs:
      - gate
      - bundle
      - crates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: netbraid-release-assets
          path: dist
      - name: Revalidate tag and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "netbraid-v${RELEASE_VERSION}" ]]; then
            printf 'release tag %s does not match package version %s\n' "$RELEASE_TAG" "$RELEASE_VERSION" >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          workflow_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          remote_tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$remote_tag_commit" != "$workflow_commit" ]]; then
            printf 'remote tag resolves to %s, workflow built %s\n' \
              "$remote_tag_commit" "$workflow_commit" >&2
            exit 1
          fi
          cd dist
          shasum -a 256 --check SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Netbraid ${RELEASE_VERSION}" \
            --generate-notes
