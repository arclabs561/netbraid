name: Check the recorded echo result
on:
  push:
    branches: [experiment/verify-zeek-echo-2215c6f]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.88"
      - name: Compare compressed and plain Wireshark input
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
          tshark --version | head -1
          curl -fsSL -o "$RUNNER_TEMP/echo.pcap.gz" https://raw.githubusercontent.com/zeek/zeek/e392402c64972c1aa4701e3fd7a8fe6621c61d73/testing/btest/Traces/echo-connections.pcap.gz
          echo "381cdf0c0aa8e2ac1c72296a32e05b28afe935b55c567d368cdabd118bda8c5d  $RUNNER_TEMP/echo.pcap.gz" | sha256sum --check
          if ! tshark -n -r "$RUNNER_TEMP/echo.pcap.gz" -T fields -e frame.number >/dev/null; then
            echo "TShark rejected direct compressed-file input."
          fi
          gzip -dc "$RUNNER_TEMP/echo.pcap.gz" > "$RUNNER_TEMP/echo.pcap"
          if ! tshark -n -r "$RUNNER_TEMP/echo.pcap" -T fields -e frame.number >/dev/null; then
            echo "TShark rejected direct plain-file input."
          fi
      - name: Verify the four aggregate digests
        run: |
          for phase in 0 1 2 3; do
            python3 eval/project-zeek-echo.py --omit-phase "$phase" "$RUNNER_TEMP/echo.pcap.gz" > "$RUNNER_TEMP/pairs.jsonl"
            cargo run --locked --quiet --manifest-path rust/Cargo.toml --example recorded_echo_identity < "$RUNNER_TEMP/pairs.jsonl" > "$RUNNER_TEMP/results-$phase.tsv"
            cat "$RUNNER_TEMP/results-$phase.tsv"
          done
          cd "$RUNNER_TEMP"
          sha256sum --check <<'DIGESTS'
          a2013e8470493e8e6d5df056a3067cf65eebcb76e9ee3b43d5c6559693c5e159  results-0.tsv
          e64eb87a4664580b3b79902a7b393828ad6f436629244c9bb247ebdfea6bca87  results-1.tsv
          3acfbd811a79b89c4950a895cee45211e2c9f047aa5e9cc64bbc7b6a921a53fc  results-2.tsv
          d5ac14cc7de885ee04827f536a1cceec078274f40cc661e6b21159b4112b000d  results-3.tsv
          DIGESTS
