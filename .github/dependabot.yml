version: 2
updates:
  - package-ecosystem: cargo
    directory: "/rust"
    schedule:
      interval: weekly
    groups:
      cargo-rust-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
